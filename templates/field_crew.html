<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UrbanSight AI — PWD Field Crew Resolution PWA | Quick Response Unit</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
    /* Background Hierarchy (Warm Linen & Sandstone Depths) */
    --bg-base: #F5F2EB;               /* Warm soft linen beige page background */
    --bg-subtle: #EDE7DA;             /* Warm sandstone background */
    --bg-surface: #FAF8F5;            /* Creamy ivory surface */
    --bg-card: rgba(255, 255, 255, 0.94); /* Crisp warm white card */
    --bg-card-hover: #ECE6D8;         /* Warm sand card hover */
    --bg-card-solid: #FFFFFF;         /* Solid card white */
    --bg-glass-panel: rgba(245, 242, 235, 0.92); /* Glassmorphism beige panel */
    --bg-pill: rgba(0, 0, 0, 0.04);   /* Soft subtle pill background */
    --bg-pill-hover: rgba(0, 0, 0, 0.08);

    /* Borders & Hairlines */
    --border-subtle: #E2DCCB;          /* Soft warm tan border */
    --border-medium: #DDD6C6;          /* Sandstone border */
    --border-hover: rgba(2, 132, 199, 0.4);
    --border-glow: rgba(2, 132, 199, 0.2);

    /* Brand Accents */
    --primary: #0284C7;               /* High-contrast civic ocean sapphire */
    --primary-gradient: linear-gradient(135deg, #0284C7 0%, #0369A1 100%);
    --primary-glow: rgba(2, 132, 199, 0.25);
    --primary-muted: rgba(2, 132, 199, 0.1);

    /* Functional Telemetry Accents */
    --caution: #EA580C;               /* Civic safety orange / terracotta */
    --caution-glow: rgba(234, 88, 12, 0.25);
    --caution-muted: rgba(234, 88, 12, 0.1);

    --critical: #DC2626;              /* Alert crimson */
    --critical-glow: rgba(220, 38, 38, 0.25);
    --critical-muted: rgba(220, 38, 38, 0.1);

    --success: #059669;               /* Deep emerald green */
    --success-glow: rgba(5, 150, 105, 0.25);
    --success-muted: rgba(5, 150, 105, 0.1);

    --indigo: #4F46E5;                /* Slate indigo */
    --purple: #7C3AED;                /* Royal amethyst */
    --purple-muted: rgba(124, 58, 237, 0.1);

    /* Typography */
    --text-primary: #1C1917;          /* Stone 900 charcoal - deep contrast */
    --text-secondary: #57534E;        /* Stone 600 warm slate */
    --text-tertiary: #78716C;         /* Stone 500 subtle */
    --text-inverse: #FFFFFF;

    --font-heading: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;

    /* Transitions & Curves */
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --transition-fast: 0.15s var(--ease-out);
    --transition-medium: 0.25s var(--ease-out);
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-heading);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.5;
            padding-bottom: 70px;
        }

        /* Top Mobile App Bar */
        .crew-header {
            background: rgba(245, 242, 235, 0.96);
            border-bottom: 2px solid var(--border-color);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .crew-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .crew-badge {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, rgba(255, 94, 30, 0.2), rgba(255, 94, 30, 0.4));
            border: 2px solid var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--accent);
            box-shadow: 0 0 15px rgba(255, 94, 30, 0.3);
        }

        .crew-title h1 {
            font-size: 1.15rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .crew-title p {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .pill-tag {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        .pill-orange { background: rgba(255, 94, 30, 0.15); color: var(--accent); border: 1px solid var(--accent); }
        .pill-green { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
        .pill-red { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }
        .pill-cyan { background: rgba(0, 229, 255, 0.15); color: var(--primary); border: 1px solid var(--primary); }

        .btn-header-nav {
            background: #FFFFFF;
            border: 1px solid var(--border-medium);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-header-nav:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* GPS & Van Status Strip */
        .van-status-strip {
            background: var(--bg-subtle);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }

        .gps-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--success);
        }

        .pulse-circle {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse-dot 1.2s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }

        /* Main Container */
        .crew-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
            width: 100%;
            flex: 1;
        }

        /* Filter Tabs */
        .filter-tabs-row {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-tab {
            background: #FFFFFF;
            border: 1px solid var(--border-medium);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .filter-tab.active {
            background: rgba(0, 229, 255, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-count {
            background: #334155;
            color: #FFFFFF;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-family: var(--font-mono);
        }

        /* Work Order Cards List */
        .work-orders-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .order-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .order-card:hover {
            border-color: #334155;
            transform: translateY(-2px);
        }

        .order-card.selected {
            border-color: var(--primary);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .order-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent);
        }

        .order-card.resolved::before {
            background: var(--success);
        }

        .order-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .order-id {
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 1.05rem;
            color: #FFFFFF;
        }

        .order-hazard-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .order-location {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .order-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            margin-bottom: 16px;
        }

        .meta-cell {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .meta-cell .lbl {
            color: var(--text-dim);
            font-size: 0.68rem;
            text-transform: uppercase;
        }

        .meta-cell .val {
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Action Buttons Row */
        .order-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-act {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            transition: all 0.2s;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-start {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #000;
        }

        .btn-start:hover {
            box-shadow: 0 0 15px var(--warning-glow);
        }

        .btn-resolve {
            background: linear-gradient(135deg, #10B981, #059669);
            color: #FFFFFF;
        }

        .btn-resolve:hover {
            box-shadow: 0 0 15px var(--success-glow);
        }

        .btn-voucher {
            background: #FFFFFF;
            border: 1px solid var(--border-medium);
            color: var(--primary);
        }

        .btn-voucher:hover {
            background: #334155;
            border-color: var(--primary);
        }

        .btn-nav-map {
            background: #FFFFFF;
            border: 1px solid var(--border-medium);
            color: var(--text-primary);
        }

        /* Inspection & Before/After Audit Modal / Drawer */
        .inspection-drawer {
            background: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-top: 16px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .audit-photos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 14px 0;
        }

        .photo-box {
            background: #000;
            border-radius: 10px;
            border: 1px solid var(--border-medium);
            overflow: hidden;
            height: 160px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .ai-audit-badge {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            margin-top: 10px;
        }

        /* Success Toast */
        .toast-box {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            background: var(--bg-card);
            border: 2px solid var(--success);
            color: #FFFFFF;
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            transition: transform 0.3s ease;
            white-space: nowrap;
        }

        .toast-box.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Bottom Fixed Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.98);
            border-top: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            backdrop-filter: blur(12px);
            z-index: 99;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.68rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--primary);
        }

        .nav-item i {
            font-size: 1.15rem;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="crew-header">
        <div class="crew-brand">
            <div class="crew-badge" title="PWD Quick Response Repair Van">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 7L12 12L21 7L12 2Z" fill="rgba(2, 132, 199, 0.2)" stroke="#0284C7" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M3 12L12 17L21 12" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sub-bar: GPS & Van Status -->
    <div class="van-status-strip">

            <div class="pulse-circle"></div>

    <!-- Main Content Area -->
    <main class="crew-container">

        <!-- Filter Tabs -->
        <div class="filter-tabs-row">

                <i class="fa-solid fa-person-digging"></i> In Progress <span class="filter-count" id="count-progress">1</span>

        <!-- List of Work Order Cards -->
        <div class="work-orders-list" id="orders-container">
            <!-- Rendered dynamically -->
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">

    <!-- Toast Popup -->
    <div class="toast-box" id="toast-box">
        <i class="fa-solid fa-circle-check" style="font-size:1.3rem; color:var(--success);"></i>
        <span id="toast-text">Ticket status updated successfully!</span>
    </div>

    <!-- Script & State Logic -->
    <script>
        // Local state of work orders
        let workOrders = [
            {
                ticket_id: "PWD-2026-OCT-0941",
                hazard_type: "POTHOLE",
                severity: "CRITICAL_P1",
                location_name: "Outer Ring Road near Bellandur Flyover Pillar 34",
                ward: "BBMP Mahadevapura Ward 85",
                lat: 12.9250,
                lng: 77.6760,
                dist_km: 0.2,
                depth_cm: 9.4,
                passes: 14,
                sla_hours: 48,
                status: "AUTO_DISPATCHED",
                cost_inr: 1850,
                sor_code: "16.2.1",
                before_img: "image1.jpg",
                after_img: "image2.jpg"
            },
            {
                ticket_id: "PWD-2026-OCT-0882",
                hazard_type: "WATERLOGGING",
                severity: "HIGH_P2",
                location_name: "Silk Board Underpass Southbound Service Arterial",
                ward: "BBMP Bommanahalli Ward 174",
                lat: 12.9125,
                lng: 77.6395,
                dist_km: 3.4,
                depth_cm: 15.0,
                passes: 8,
                sla_hours: 24,
                status: "CREW_ASSIGNED",
                cost_inr: 3400,
                sor_code: "12.4",
                before_img: "image2.jpg",
                after_img: "image1.jpg"
            },
            {
                ticket_id: "PWD-2026-OCT-0715",
                hazard_type: "POTHOLE",
                severity: "CRITICAL_P1",
                location_name: "VVCE Ring Road Junction, Gokulam, Mysuru",
                ward: "MCC Mysuru Ward 9",
                lat: 12.3190,
                lng: 76.6450,
                dist_km: 142.0,
                depth_cm: 8.6,
                passes: 6,
                sla_hours: 48,
                status: "IN_PROGRESS",
                cost_inr: 1620,
                sor_code: "16.2",
                before_img: "image1.jpg",
                after_img: "image2.jpg"
            },
            {
                ticket_id: "PWD-2026-OCT-0604",
                hazard_type: "ROAD_CRACK",
                severity: "MEDIUM_P3",
                location_name: "Hebbal Flyover Kempapura Bus Bay Ramp",
                ward: "BBMP East Zone",
                lat: 13.0358,
                lng: 77.5970,
                dist_km: 14.5,
                depth_cm: 2.8,
                passes: 9,
                sla_hours: 72,
                status: "RESOLVED",
                cost_inr: 950,
                sor_code: "14.1",
                before_img: "image2.jpg",
                after_img: "image2.jpg"
            }
        ];

        let currentFilter = "ALL";
        let expandedTicketId = "PWD-2026-OCT-0941";

        function renderOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = "";

            const filtered = workOrders.filter(o => {
                if (currentFilter === "ALL") return true;
                if (currentFilter === "PENDING") return o.status === "AUTO_DISPATCHED" || o.status === "CREW_ASSIGNED";
                if (currentFilter === "IN_PROGRESS") return o.status === "IN_PROGRESS";
                if (currentFilter === "RESOLVED") return o.status === "RESOLVED";
                return true;
            });

            // Update counts
            document.getElementById('count-all').textContent = workOrders.length;
            document.getElementById('count-pending').textContent = workOrders.filter(o => o.status === "AUTO_DISPATCHED" || o.status === "CREW_ASSIGNED").length;
            document.getElementById('count-progress').textContent = workOrders.filter(o => o.status === "IN_PROGRESS").length;
            document.getElementById('count-resolved').textContent = workOrders.filter(o => o.status === "RESOLVED").length;

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted); font-family:var(--font-mono);">No work orders matching this filter.</div>`;
                return;
            }

            filtered.forEach(order => {
                const card = document.createElement('div');
                const isSelected = order.ticket_id === expandedTicketId;
                card.className = `order-card ${order.status === 'RESOLVED' ? 'resolved' : ''} ${isSelected ? 'selected' : ''}`;
                
                const sevPill = order.severity.includes('P1') ? 'pill-red' : (order.severity.includes('P2') ? 'pill-orange' : 'pill-cyan');
                const statusPill = order.status === 'RESOLVED' ? 'pill-green' : (order.status === 'IN_PROGRESS' ? 'pill-orange' : 'pill-cyan');

                card.innerHTML = `
                    <div class="order-top">
                        <span class="order-id">${order.ticket_id}</span>
                        <div style="display:flex; gap:6px;">
                            <span class="pill-tag ${sevPill}">${order.severity.replace('_', ' ')}</span>
                            <span class="pill-tag ${statusPill}">${order.status.replace('_', ' ')}</span>
                        </div>
                    </div>

                    <div class="order-hazard-title">
                        <i class="fa-solid fa-triangle-exclamation" style="color:var(--accent);"></i>
                        <span>${order.hazard_type.replace('_', ' ')} (${order.depth_cm}cm)</span>
                    </div>

                    <div class="order-location">
                        <i class="fa-solid fa-location-dot" style="color:var(--primary);"></i>
                        <span>${order.location_name}</span>
                    </div>

                    <div class="order-meta-grid">
                        <div class="meta-cell">
                            <span class="lbl">Proximity</span>
                            <span class="val" style="color:var(--primary);">${order.dist_km} km away</span>
                        </div>
                        <div class="meta-cell">
                            <span class="lbl">Ward Unit</span>
                            <span class="val">${order.ward.split('/')[0]}</span>
                        </div>
                        <div class="meta-cell">
                            <span class="lbl">CPWD SOR Est.</span>
                            <span class="val" style="color:var(--success);">₹${order.cost_inr} INR</span>
                        </div>
                        <div class="meta-cell">
                            <span class="lbl">Bus Passes</span>
                            <span class="val">${order.passes} Verified</span>
                        </div>
                    </div>

                    <div class="order-actions">
                        ${order.status !== 'RESOLVED' && order.status !== 'IN_PROGRESS' ? `
                            <button class="btn-act btn-start" onclick="event.stopPropagation(); updateOrderStatus('${order.ticket_id}', 'IN_PROGRESS');">
                                <i class="fa-solid fa-person-digging"></i> Start Repair
                            </button>
                        ` : ''}

                        ${order.status === 'IN_PROGRESS' ? `
                            <button class="btn-act btn-resolve" onclick="event.stopPropagation(); updateOrderStatus('${order.ticket_id}', 'RESOLVED');">
                                <i class="fa-solid fa-circle-check"></i> Complete & Close
                            </button>
                        ` : ''}

                        ${order.status === 'RESOLVED' ? `
                            <button class="btn-act" style="background:#1E293B; color:var(--success); border:1px solid var(--success); cursor:default;" disabled>
                                <i class="fa-solid fa-shield-check"></i> Repaired & Audited
                            </button>
                        ` : ''}

                        <a href="voucher.html?ticket=${order.ticket_id}" class="btn-act btn-voucher" onclick="event.stopPropagation();">
                            <i class="fa-solid fa-file-invoice"></i> Tender Voucher
                        </a>

                        <button class="btn-act btn-nav-map" onclick="event.stopPropagation(); openDirections(${order.lat}, ${order.lng});">
                            <i class="fa-solid fa-diamond-turn-right"></i> Navigate
                        </button>
                    </div>

                    <!-- Inspection / Before & After Drawer -->
                    <div class="inspection-drawer" id="drawer-${order.ticket_id}" style="display:${isSelected ? 'block' : 'none'};">
                        <div style="font-size:0.8rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">
                            <i class="fa-solid fa-camera"></i> Before & After AI Inspection Audit
                        </div>

                        <div class="audit-photos-grid">
                            <div class="photo-box">
                                <span class="photo-tag">BEFORE (AI Sighting)</span>
                                <img src="${order.before_img}" alt="Before Repair">
                            </div>
                            <div class="photo-box">
                                <span class="photo-tag" style="background:rgba(16,185,129,0.85);">AFTER (Field Patch)</span>
                                <img src="${order.after_img}" alt="After Repair">
                            </div>
                        </div>

                        <div class="ai-audit-badge">
                            <i class="fa-solid fa-circle-check"></i>
                            <span>AI Surface Audit: Level restored with 98.4% asphalt compaction confidence.</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    expandedTicketId = expandedTicketId === order.ticket_id ? null : order.ticket_id;
                    renderOrders();
                });

                container.appendChild(card);
            });
        }

        // Update Ticket Status
        async function updateOrderStatus(ticketId, newStatus) {
            const order = workOrders.find(o => o.ticket_id === ticketId);
            if (!order) return;

            order.status = newStatus;
            renderOrders();

            // Notify User
            showToast(
                newStatus === 'RESOLVED' ? 
                `🎉 Ticket ${ticketId} Closed & Verified!` : 
                `🛠️ Work started on ${ticketId}`
            );

            // Attempt live sync with Node A backend
            try {
                await fetch(`/api/work-orders/${ticketId}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        status: newStatus,
                        remarks: `Field update by Quick Response Van VAN-04`,
                        crew_id: "VAN-04"
                    })
                });
            } catch (e) {
                // Offline fallback mode active
            }
        }

        function openDirections(lat, lng) {
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-box');
            document.getElementById('toast-text').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Tab Filters
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.getAttribute('data-filter');
                renderOrders();
            });
        });

        // Hybrid API Sync: Fetch live work orders from backend if running
        async function syncBackendWorkOrders() {
            try {
                const res = await fetch('/api/work-orders');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0) {
                        data.forEach(item => {
                            const existing = workOrders.find(w => w.ticket_id === item.ticket_id);
                            if (existing) {
                                existing.status = item.status;
                            } else {
                                workOrders.push({
                                    ticket_id: item.ticket_id,
                                    hazard_type: item.hazard_type,
                                    severity: item.severity,
                                    location_name: item.location_name,
                                    ward: item.dispatched_to,
                                    lat: item.lat,
                                    lng: item.lng,
                                    dist_km: 1.2,
                                    depth_cm: 8.5,
                                    passes: item.cluster_count,
                                    sla_hours: item.sla_hours,
                                    status: item.status,
                                    cost_inr: item.estimated_cost_inr || 1850,
                                    sor_code: item.cpwd_sor_code || "16.2.1",
                                    before_img: "image1.jpg",
                                    after_img: "image2.jpg"
                                });
                            }
                        });
                        renderOrders();
                    }
                }
            } catch (e) {}
        }

        renderOrders();
        syncBackendWorkOrders();
    </script>
</body>
</html>
